<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0a1113"/>
  <!-- two stores: the same memory on two replicas -->
  <rect x="10" y="18" width="20" height="9" rx="3" fill="#e3eaec" opacity="0.9"/>
  <rect x="10" y="37" width="20" height="9" rx="3" fill="#e3eaec" opacity="0.55"/>
  <!-- the merge contract: both converge to one -->
  <path d="M32 22.5 L40 32 M32 41.5 L40 32" fill="none" stroke="#8894f4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- the merged store -->
  <rect x="40" y="27.5" width="14" height="9" rx="3" fill="#8894f4"/>
</svg>
