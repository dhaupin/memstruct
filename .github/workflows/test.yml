name: test
on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '22' }
      - run: npm install --no-fund --no-audit
      - run: npm test
      # The battery: language gate + action pins + spec/schema consistency +
      # the docs truth gates + the merge conformance audit. The SAME
      # `npm run check` is the prepublishOnly gate, so a red battery blocks a
      # PR and a publish.
      - name: check battery
        run: npm run check
      # The linter must bite both ways: a valid store passes, a broken one
      # refuses. A check that never fails proves nothing.
      - name: lint bites both ways
        run: |
          node bin/cli.mjs lint conformance/cases/01-clean/local.json
          echo '{"memstruct":1,"records":[{"createdAt":1}]}' > /tmp/bad.json
          if node bin/cli.mjs lint /tmp/bad.json >/dev/null 2>&1; then
            echo "lint should have failed on a record with no id"; exit 1
          fi
      # The site half builds here too, so a broken landing red-lights the PR
      # rather than surprising the Cloudflare Pages project (root `web`,
      # build `npm run build`, output `dist`).
      - name: Install web deps
        run: npm install --prefix web --no-audit --no-fund
      - name: Web build (prestruct prerender)
        run: npm run build --prefix web

      # eyestruct: armed, but wakes only when a visual home (labs/.eyes/) is
      # committed. `eyestruct gate` is browserless + read-only (exit 1 on
      # unexplained drift), so it needs no chrome. Canon is CI-cut (eyestruct's
      # own ratify lane); this battery only refuses drift. Issue #35.
      - name: Install eyestruct (pinned, parked until labs/.eyes lands)
        if: ${{ hashFiles('labs/.eyes/manifest.yml') != '' }}
        run: npm install --no-save --no-audit --no-fund eyestruct@1.1.0
      - name: Eyestruct gate (visual memory)
        if: ${{ hashFiles('labs/.eyes/manifest.yml') != '' }}
        run: node node_modules/eyestruct/bin/eyestruct.js gate
