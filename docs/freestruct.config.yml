# GENERATED by coreforge sync from site.config.js - edit that file, then run `npm run sync`.
# Hand edits here are drift and fail `npm run sync:check`.

site:
  name: memstruct
  # ORIGIN ONLY - no path. Page paths carry /memstruct via basePath
  # (below); putting the path here too makes the engine join host+path+slug and
  # the strict link check resolve the prefix as a directory (freestruct#32).
  url: docs.creadev.org
  description: "A memory standard for all: one record format and one merge contract, so any two memory systems exchange memory without a rewrite."

# The deploy path the output tree is served under (Jekyll's baseurl). freestruct
# strips it from root-absolute hrefs so the strict link check resolves a
# /memstruct href against the tree, not the prefix as a directory.
basePath: /memstruct

# The baked output tree (discovered by freestruct from docs/).
outputDir: _site

# Fail the build on broken internal links (the truth pass). Requires the pinned
# freestruct to carry the basePath-aware strip (>= 1.2.0, freestruct#32).
linkCheck: true

# Author identity - ships as a schema.org Person under "founder" on the
# injected Organization JSON-LD block (the engine edition template carries the
# {{authorJson}} seam).
author:
  name: dhaupin
  url: https://github.com/dhaupin

# Maintainer identity - custom JSON-LD appended after the built-in
# Organization + WebSite pair (the legacy list form).
jsonLd:
  - "@type": Person
    name: dhaupin
    url: https://github.com/dhaupin/memstruct
    jobTitle: memstruct maintainer

twitter:
  card: summary_large_image
